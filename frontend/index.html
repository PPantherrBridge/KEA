<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEA RAG Chatbot</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="chat-container">
    <h1>KEA RAG Chatbot</h1>
    <p class="subtitle">Answers are restricted to <code>kea.kar.nic.in</code> content.</p>

    <section id="chat-box" class="chat-box"></section>

    <form id="chat-form" class="chat-form">
      <input id="question-input" type="text" placeholder="Ask a KEA-related question..." required />
      <button type="submit">Send</button>
    </form>

    <div id="loading" class="loading hidden">Thinking...</div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
